experiment:
  class_labels:
  - Target
  - NonTarget
  events:
    non_target: 29
    target: 1
  feedback_type: visual
  has_training_test_split: true
  instructions: Participants fixate center of screen, concentrate on target letter, silently count its occurrences. Avoid
    blinking during visual presentation.
  mode: online
  n_classes: 2
  paradigm: p300
  primary_modality: visual
  stimulus_modalities:
  - visual
  stimulus_type: RSVP letters
  study_design: 'RSVP (Rapid Serial Visual Presentation) BCI speller where 30 symbols are presented one-by-one in random order
    at the center of the screen. Three conditions tested: NoColor 116ms SOA, Color 116ms SOA, and Color 83ms SOA. Colors used
    to facilitate discrimination.'
  synchronicity: synchronous
  task_type: spelling
  trial_duration: 46.5
file_format: EEG
methodology: Three experimental conditions tested (NoColor 116ms, Color 116ms, Color 83ms SOA). Each condition included calibration,
  copy-spelling, and free-spelling phases. Vocabulary of 30 symbols presented one-by-one at screen center in pseudo-random
  order. EEG recorded at 1000 Hz with 63 channels, downsampled to 200 Hz for ERP analysis. Classification using LDA with shrinkage
  on spatio-temporal features from 5 individually selected time windows. Symbol selection based on averaged classifier output
  across 10 sequences.
