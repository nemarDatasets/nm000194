abstract: A Brain Computer Interface (BCI) speller using rapid serial visual presentation (RSVP) paradigm for gaze-independent
  mental typewriting. Twelve healthy participants successfully operated the RSVP speller with mean online spelling rate of
  1.43 symb/min and mean symbol selection accuracy of 94.8%. The RSVP speller does not require gaze shifts and can be operated
  by non-spatial visual attention, making it suitable for patients with impaired oculo-motor control.
